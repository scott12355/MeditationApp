query GetUserBreathingStats($userID: ID!) {
    getUserBreathingStats(userID: $userID) {
        userID
        totalSessions
        totalDuration
        currentStreak
        longestStreak
        lastSessionDate
        totalCyclesCompleted
        favoriteTechnique
        sessionsThisWeek
        sessionsThisMonth
        updatedAt
    }
}
